version: 2

models:
  - name: stg_orders
    description: "Basic view of orders.."
    columns:
      - name: order_id
        description: "Unique key test"
        tests: 
         - unique 
         - not_null
      - name: customer_id
        description: "Foreign key cust"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('scd_customers')
                field: customer_id
      - name: order_date
        description: "Date the order was placed"
        tests: 
          - not_null
      - name: status
        description: "Is the order delivered or not"
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'processing', 'returned', 'cancelled']
      - name: total_amount
        description: "Total order amount in currency"

  - name: stg_order_items
    description: "Staging view of order line items. One row per product per order."
    columns:
      - name: order_item_id
        description: "Unique order line identifier"
        tests: 
          - unique 
          - not_null
      - name: order_id
        description: "Foreign key to order"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: "Foreign key to product"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        description: "Quantity ordered"
        tests: 
         - not_null
      - name: unit_price
        description: "Unit price at time of order"

  - name: stg_products
    description: "Staging view of products. per grain."
    columns:
      - name: product_id
        description: "Unique product id"
        tests: 
          - not_null
          - unique
      - name: product_name
        description: "Product name"
      - name: category
        description: "Product category"
      - name: price
        description: " product price"
